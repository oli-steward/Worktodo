// ── Focus view ───────────────────────────────────────────────────────────────

/** Pure — returns ordered list of non-done tasks of `priority` (default 'urgent') for a focus-style view. */
function getFocusTasks(phasesData, phaseKey, priority){
  const prio=priority||'urgent';
  const ph=phasesData[phaseKey];
  if(!ph) return [];
  const all=[];
  (ph.topics||[]).filter(t=>!t.archived).forEach(topic=>{
    (topic.subjects||[]).forEach(sub=>{
      (sub.tasks||[]).forEach(task=>{
        if(!task.done&&task.priority===prio)
          all.push({topicId:topic.id,subjectId:sub.id,taskId:task.id,
            text:task.text,topicName:topic.name,topicColor:topic.color,subjectName:sub.name,
            focusUrgent:!!task.focusUrgent});
      });
    });
  });
  const order=ph[focusOrderKey(prio)]||[];
  const seen=new Set();
  const result=[];
  order.forEach(ref=>{
    const key=`${ref.topicId}-${ref.subjectId}-${ref.taskId}`;
    const found=all.find(t=>t.topicId===ref.topicId&&t.subjectId===ref.subjectId&&t.taskId===ref.taskId);
    if(found&&!seen.has(key)){result.push(found);seen.add(key);}
  });
  all.forEach(t=>{
    const key=`${t.topicId}-${t.subjectId}-${t.taskId}`;
    if(!seen.has(key)) result.push(t);
  });
  return result;
}
window.getFocusTasks=getFocusTasks;

/** Pure — key under which a category's manual order is stored on a phase. */
function focusOrderKey(priority){
  const prio=priority||'urgent';
  return prio==='urgent'?'focusOrder':'focusOrder_'+prio;
}
window.focusOrderKey=focusOrderKey;

/** Pure — reorders a category's focus list, updating the phase's order array. */
function reorderFocus(phasesData, phaseKey, fromIdx, toIdx, after, priority){
  const prio=priority||'urgent';
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];
  if(!ph) return data;
  const tasks=getFocusTasks(phasesData,phaseKey,prio);
  if(fromIdx<0||fromIdx>=tasks.length||toIdx<0||toIdx>=tasks.length||fromIdx===toIdx) return data;
  const refs=tasks.map(t=>({topicId:t.topicId,subjectId:t.subjectId,taskId:t.taskId}));
  const [moved]=refs.splice(fromIdx,1);
  const adj=fromIdx<toIdx?toIdx-1:toIdx;
  refs.splice(after?adj+1:adj,0,moved);
  ph[focusOrderKey(prio)]=refs;
  return data;
}
window.reorderFocus=reorderFocus;

/** Pure — toggles the focusUrgent flag on a task. Does not touch priority. */
function toggleFocusUrgent(phasesData,phaseKey,topicId,subjectId,taskId){
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];if(!ph) return data;
  const topic=ph.topics.find(t=>t.id===topicId);if(!topic) return data;
  const sub=topic.subjects.find(s=>s.id===subjectId);if(!sub) return data;
  const task=sub.tasks.find(t=>t.id===taskId);if(!task) return data;
  if(task.focusUrgent) delete task.focusUrgent;
  else task.focusUrgent=true;
  return data;
}
window.toggleFocusUrgent=toggleFocusUrgent;

// ── Task reorder ─────────────────────────────────────────────────────────────

/** Pure — moves a subject within a topic's subjects array. Returns new phasesData. */
function moveSubject(phasesData,phaseKey,topicId,fromIdx,toIdx,after){
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];if(!ph) return data;
  const topic=ph.topics.find(t=>t.id===topicId);if(!topic) return data;
  const subjects=topic.subjects;
  if(fromIdx<0||fromIdx>=subjects.length||toIdx<0||toIdx>=subjects.length||fromIdx===toIdx) return data;
  const [moved]=subjects.splice(fromIdx,1);
  const adj=fromIdx<toIdx?toIdx-1:toIdx;
  subjects.splice(after?adj+1:adj,0,moved);
  return data;
}
window.moveSubject=moveSubject;

/** Pure — moves a task within a subject's task array. Returns new phasesData. */
function moveTask(phasesData,phaseKey,topicId,subjectId,fromIdx,toIdx,after){
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];
  if(!ph) return data;
  const topic=ph.topics.find(t=>t.id===topicId);
  if(!topic) return data;
  const sub=topic.subjects.find(s=>s.id===subjectId);
  if(!sub) return data;
  const tasks=sub.tasks;
  if(fromIdx<0||fromIdx>=tasks.length||toIdx<0||toIdx>=tasks.length||fromIdx===toIdx) return data;
  const [moved]=tasks.splice(fromIdx,1);
  const adj=fromIdx<toIdx?toIdx-1:toIdx;
  tasks.splice(after?adj+1:adj,0,moved);
  return data;
}
window.moveTask=moveTask;

// ── Phase transition ────────────────────────────────────────────────────────

/** Pure function — returns a deep-copy of phasesData with the transition applied.
 *  Exported as window.transitionTopics so the test suite can call it directly. */
function transitionTopics(phasesData, fromKey, toKey, selectedTopicIds){
  const data=JSON.parse(JSON.stringify(phasesData));
  const fromPhase=data[fromKey];
  const toPhase=data[toKey];
  if(!fromPhase||!toPhase) return {phases:data,error:'Invalid phase key'};

  selectedTopicIds.forEach(tid=>{
    const topic=fromPhase.topics.find(t=>t.id===tid);
    if(!topic) return;

    // find or create matching topic in destination
    let destTopic=toPhase.topics.find(t=>t.name.toLowerCase()===topic.name.toLowerCase());
    if(!destTopic){
      const allTopics=Object.values(data).flatMap(p=>p.topics);
      const maxTid=allTopics.reduce((a,t)=>Math.max(a,t.id),0);
      destTopic={id:maxTid+1,name:topic.name,color:topic.color,subjects:[]};
      toPhase.topics.push(destTopic);
    }

    topic.subjects.forEach(sub=>{
      // find or create matching subject in destination topic
      let destSub=destTopic.subjects.find(s=>s.name.toLowerCase()===sub.name.toLowerCase());
      if(!destSub){
        const allSubs=Object.values(data).flatMap(p=>p.topics.flatMap(t=>t.subjects));
        const maxSid=allSubs.reduce((a,s)=>Math.max(a,s.id),0);
        destSub={id:maxSid+1,name:sub.name,goal:sub.goal||'',tasks:[]};
        destTopic.subjects.push(destSub);
      }

      // append only unresolved tasks; deduplicate by text (case-insensitive)
      sub.tasks.filter(t=>!t.done).forEach(task=>{
        const exists=destSub.tasks.some(t=>t.text.toLowerCase()===task.text.toLowerCase());
        if(!exists){
          const maxId=destSub.tasks.reduce((a,t)=>Math.max(a,t.id),0);
          destSub.tasks.push({id:maxId+1,text:task.text,done:false,priority:task.priority});
        }
      });
    });
  });

  fromPhase.concluded=true;
  return {phases:data};
}
window.transitionTopics=transitionTopics;

function getNextPhaseKey(phasesData,phaseKey){
  const keys=getSortedPhaseKeys(phasesData);   // was Object.keys(): insertion order is unreliable
  const idx=keys.indexOf(phaseKey);
  return (idx===-1||idx>=keys.length-1)?null:keys[idx+1];
}
window.getNextPhaseKey=getNextPhaseKey;

/** Pure — returns initial wizard state. Exported for tests. */
function buildWizardState(fromKey, phasesData){
  const nums=Object.keys(phasesData).map(k=>parseInt(k.replace(/\D/g,''))||0).filter(n=>n>0);
  const nextNum=nums.length?Math.max(...nums)+1:2;
  const topics=(phasesData[fromKey]||{topics:[]}).topics;
  return {
    fromKey,
    step:1,
    newKey:`PH${nextNum}`,
    newLabel:`Phase ${nextNum}`,
    newStartDate:'',
    newEndDate:'',
    selectedTids:topics
      .filter(t=>t.subjects.flatMap(s=>s.tasks).some(tk=>!tk.done))
      .map(t=>t.id)
  };
}
window.buildWizardState=buildWizardState;

/** Pure — creates new phase and runs transition. Exported for tests. */
function applyWizard(state, phasesData){
  const data=JSON.parse(JSON.stringify(phasesData));
  data[state.newKey]={label:state.newLabel,startDate:state.newStartDate,endDate:state.newEndDate,topics:[]};
  const result=transitionTopics(data,state.fromKey,state.newKey,state.selectedTids);
  return result.error?{phases:data,error:result.error}:{phases:result.phases};
}
window.applyWizard=applyWizard;

function renderWizard(){
  const existing=document.getElementById('conclude-wizard');

    s.style.cssText=`font-size:10px;padding:2px 8px;border-radius:4px;border:0.5px solid ${active?'#1a1a1a':past?'#ccc':'#eee'};background:${active?'#1a1a1a':'transparent'};color:${active?'#fff':past?'#888':'#bbb'}`;

function _wizFooter(c,showBack,onNext,showConfirm){
  const f=document.createElement('div');
  f.style.cssText='display:flex;gap:6px;justify-content:flex-end;padding-top:8px;border-top:0.5px solid #eee';
  const cancelBtn=document.createElement('button');
  cancelBtn.className='export-btn';cancelBtn.textContent='Cancel';cancelBtn.onclick=closeWizard;
  f.appendChild(cancelBtn);
  if(showBack){
    const b=document.createElement('button');
    b.className='export-btn';b.textContent='← Back';
    b.onclick=()=>{wizardState.step--;renderWizard();};
    f.appendChild(b);
  }
  if(onNext){
    const n=document.createElement('button');
    n.className='export-btn';n.textContent='Next →';n.onclick=onNext;
    f.appendChild(n);
  }
  if(showConfirm){
    const btn=document.createElement('button');
    btn.className='export-btn';btn.textContent='Conclude & Create →';btn.onclick=executeWizard;
    f.appendChild(btn);
  }
  c.appendChild(f);
}

function _wizAdvance(){
  if(!wizardState.newLabel.trim()){
    const inp=document.getElementById('wiz-name');
    if(inp) inp.focus();
    return;
  }
  wizardState.step++;
  renderWizard();
}

function closeWizard(){
  const el=document.getElementById('conclude-wizard');
  if(el) el.remove();
  wizardState=null;
}

function executeWizard(){
  if(!wizardState) return;
  const result=applyWizard(wizardState,phases);
  if(result.error){alert('Error: '+result.error);return;}
  const newKey=wizardState.newKey;
  phases=result.phases;
  closeWizard();
  currentPhase=newKey;
  saveCurrentPhase();
  _histSetLabel('Conclude phase');
  saveData();
  renderTabs();
  renderTable();
  renderColNumbers();
}

/**

 */
function _testGoalBanner() {
  const T = (desc, cond) => {
    if (!cond) console.error('FAIL:', desc);
    else console.log('✓', desc);
  };

  // ── Fixture ──────────────────────────────────────────────────────────────
  const mkPhase = (topicCount) => ({
    topics: Array.from({length: topicCount}, (_, i) => ({
      id: i + 1,
      name: `Topic${i + 1}`,
      color: '#aaa',
      subjects: [{ id: i + 1, name: 'S', goal: i % 2 === 0 ? `Goal${i}` : '', tasks: [] }]
    }))
  });

  // ── Test 1: GOAL_LIMIT cap ────────────────────────────────────────────────
  const ph4 = mkPhase(5);
  const shown = ph4.topics.filter(t => !t.archived).slice(0, GOAL_LIMIT);
  T('shows exactly GOAL_LIMIT (3) topics by default', shown.length === 3);

  const all = ph4.topics.filter(t => !t.archived);
  T('show-all returns all 5 topics', all.length === 5);

  // ── Test 3: fewer topics than GOAL_LIMIT — no toggle needed ──────────────
  const ph2 = mkPhase(2);
  const hasMore = ph2.topics.length > GOAL_LIMIT;
  T('no toggle when topics < GOAL_LIMIT', !hasMore);

  // ── Test 4: goals extraction strips empty strings ─────────────────────────
  const goals = ph4.topics[0].subjects.map(s => s.goal).filter(Boolean);
  T('topic 1 has one non-empty goal', goals.length === 1 && goals[0] === 'Goal0');

  const goalsEmpty = ph4.topics[1].subjects.map(s => s.goal).filter(Boolean);
  T('topic 2 has no non-empty goals', goalsEmpty.length === 0);

  // ── Test 5: archived topics are excluded ─────────────────────────────────
  const phA = mkPhase(4);
  phA.topics[0].archived = true;
  const visible = phA.topics.filter(t => !t.archived);
  T('archived topics excluded', visible.length === 3);

  // ── Test 6: getOrderedBannerTopics respects goalBannerOrder ──────────────
  const phO = mkPhase(4);
  phO.goalBannerOrder = [4, 2, 1, 3];
  const orderedAll = getOrderedBannerTopics(phO);

  // ── Test 7: topics not in goalBannerOrder appended at end ─────────────────
  const phP = mkPhase(4);

  T('partial order: ordered topics first', orderedPartial[0].id === 3 && orderedPartial[1].id === 1);
  T('partial order: remaining appended', orderedPartial.length === 4);

  // ── Test 8: drag reorder — moving item forward ────────────────────────────
  const ids8 = [1, 2, 3, 4];
  const fromIdx8 = 0, toIdx8 = 2, after8 = false;
  const [moved8] = ids8.splice(fromIdx8, 1);
  const adj8 = fromIdx8 < toIdx8 ? toIdx8 - 1 : toIdx8;

  T('drag reorder: [1,2,3,4] move 1 before 3 → [2,1,3,4]', ids8.join(',') === '2,1,3,4');

  // ── Test 9: hide topic — excluded from visible list ───────────────────────
  const phH = mkPhase(4);
  phH.bannerHidden = [2];
  const ordH = getOrderedBannerTopics(phH);
  const visH = ordH.filter(t => !(phH.bannerHidden||[]).includes(t.id));
  T('hidden topic excluded from visible', visH.length === 3 && visH.every(t => t.id !== 2));

  // ── Test 10: unhide restores topic ────────────────────────────────────────
  phH.bannerHidden = phH.bannerHidden.filter(id => id !== 2);
  const visH2 = getOrderedBannerTopics(phH).filter(t => !(phH.bannerHidden||[]).includes(t.id));
  T('unhide restores topic', visH2.length === 4);

  // ── Test 11: manual goal stored and retrieved ─────────────────────────────
  const phG = mkPhase(3);
  phG.bannerGoals = { 2: 'Ship it' };
  T('manual goal retrieved by topicId', (phG.bannerGoals||{})[2] === 'Ship it');
  T('missing goal returns undefined (not error)', (phG.bannerGoals||{})[99] === undefined);

  console.log('Goal banner tests done.');
}
_testGoalBanner();

/**
 * _testHistory — inline unit tests for the undo/redo history helpers.
 * Runs once at startup; results appear in the browser console.
 * Tests are pure (no DOM side-effects) and never touch live phase data.
 */
function _testHistory() {
  const T = (desc, cond) => {
    if (!cond) console.error('FAIL:', desc);
    else console.log('✓', desc);
  };
  // Fixture builder: n tasks in one subject of one topic of one phase.
  const mk = (taskTexts, doneFlags) => ({
    PH1: { label: 'Phase 1', topics: [
      { id: 1, name: 'T', color: '#000', subjects: [
        { id: 1, name: 'S', goal: '', tasks: taskTexts.map((tx, i) => ({ id: i + 1, text: tx, done: !!(doneFlags && doneFlags[i]) })) }
      ] }
    ] }
  });
  const J = o => JSON.stringify(o);

  // ── Test 1: _histCounts on a fixture ──────────────────────────────────────
  const c = _histCounts(mk(['a', 'b', 'c'], [true, false, false]));
  T('counts 1 phase', c.phases === 1);
  T('counts 1 topic', c.topics === 1);
  T('counts 1 subject', c.subjects === 1);
  T('counts 3 tasks', c.tasks === 3);
  T('counts 1 done', c.done === 1);
  T('counts on null returns zeros', _histCounts(null).phases === 0);

  // ── Test 2: task added / deleted ──────────────────────────────────────────
  T('one task added', _histDiffLabel(J(mk(['a'])), J(mk(['a', 'b']))) === 'Task added');
  T('one task deleted', _histDiffLabel(J(mk(['a', 'b'])), J(mk(['a']))) === 'Task deleted');

  // ── Test 3: plural task delta ─────────────────────────────────────────────
  T('three tasks added', _histDiffLabel(J(mk(['a'])), J(mk(['a', 'b', 'c', 'd']))) === '3 tasks added');
  T('two tasks deleted', _histDiffLabel(J(mk(['a', 'b', 'c'])), J(mk(['a']))) === '2 tasks deleted');

  // ── Test 4: completion toggles ────────────────────────────────────────────
  T('task completed', _histDiffLabel(J(mk(['a', 'b'], [false, false])), J(mk(['a', 'b'], [true, false]))) === 'Task completed');
  T('task reopened', _histDiffLabel(J(mk(['a', 'b'], [true, false])), J(mk(['a', 'b'], [false, false]))) === 'Task reopened');

  // ── Test 5: topic / subject / phase deltas ────────────────────────────────
  const twoTopics = mk(['a']);
  twoTopics.PH1.topics.push({ id: 2, name: 'T2', color: '#111', subjects: [] });
  T('topic added', _histDiffLabel(J(mk(['a'])), J(twoTopics)) === 'Topic added');
  T('topic deleted', _histDiffLabel(J(twoTopics), J(mk(['a']))) === 'Topic deleted');

  const twoSubs = mk(['a']);
  twoSubs.PH1.topics[0].subjects.push({ id: 2, name: 'S2', goal: '', tasks: [] });
  T('subject added', _histDiffLabel(J(mk(['a'])), J(twoSubs)) === 'Subject added');
  T('subject deleted', _histDiffLabel(J(twoSubs), J(mk(['a']))) === 'Subject deleted');

  const twoPhases = mk(['a']);
  twoPhases.PH2 = { label: 'Phase 2', topics: [] };
  T('phase added', _histDiffLabel(J(mk(['a'])), J(twoPhases)) === 'Phase added');
  T('phase deleted', _histDiffLabel(J(twoPhases), J(mk(['a']))) === 'Phase deleted');

  // ── Test 6: precedence — phase change wins over task change ───────────────
  const phasePlusTasks = mk(['a', 'b', 'c']);
  phasePlusTasks.PH2 = { label: 'Phase 2', topics: [] };
  T('phase delta outranks task delta', _histDiffLabel(J(mk(['a'])), J(phasePlusTasks)) === 'Phase added');

  // ── Test 7: no structural change → 'Edit' ─────────────────────────────────
  T('identical input is Edit', _histDiffLabel(J(mk(['a'])), J(mk(['a']))) === 'Edit');
  T('rename only is Edit', _histDiffLabel(J(mk(['a'])), J(mk(['renamed']))) === 'Edit');

  // ── Test 8: malformed JSON → 'Edit' ───────────────────────────────────────
  T('malformed prev is Edit', _histDiffLabel('{not json', J(mk(['a']))) === 'Edit');
  T('malformed next is Edit', _histDiffLabel(J(mk(['a'])), 'undefined{') === 'Edit');
  T('both malformed is Edit', _histDiffLabel('x', 'y') === 'Edit');

  console.log('History tests done.');
}
_testHistory();

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
function importXlsx(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const phaseMap={'Projects PH2':'PH2','Projects PH3':'PH3','Projects PH4':'PH4'};
      let imported=0;

      wb.SheetNames.forEach(sheetName=>{
        const phKey=phaseMap[sheetName];
        if(!phKey) return;
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
        if(!rows||rows.length<2) return;

        const parsed=parseSheet(rows);
        if(!phases[phKey]) phases[phKey]={label:sheetName,topics:[]};
        mergePhase(phases[phKey],parsed);
        imported++;
      });

      if(imported===0){alert('No matching sheets found. Make sure your sheets are named: Projects PH2, Projects PH3, Projects PH4');return;}
      _histSetLabel('Import Excel');
      saveData();
      renderTabs();
      renderTable();
      const toast=document.getElementById('export-toast');
      toast.textContent='Imported!';
      toast.style.opacity='1';
      clearTimeout(toast._t);
      toast._t=setTimeout(()=>{toast.style.opacity='0';toast.textContent='Downloaded!';},2500);
    }catch(err){
      alert('Import error: '+err.message);
      console.error(err);
    }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

function parseSheet(rows){
  const topics=[];
  let currentTopic=null;
  let topicId=1000;
  let subjectId=1000;

  for(let i=1;i<Math.min(rows.length,74);i++){
    const row=rows[i];
    const col0=String(row[0]||'').trim();
    const col1=String(row[1]||'').trim();

    if(!col0&&!col1) continue;

    if(col0&&col0!=='->'&&!col0.startsWith('->')){
      currentTopic={id:topicId++,name:col0,color:COLORS[topics.length%COLORS.length],subjects:[]};
      topics.push(currentTopic);
    }

    if(col1&&currentTopic){
      const tasks=[];
      for(let c=2;c<row.length;c++){
        const raw=row[c];
        if(raw===undefined||raw===null) continue;
        const cell=String(raw).trim();
        if(!cell||cell==='undefined') continue;
        const text=cell.startsWith('-')?cell.replace(/^-\s*/,'').trim():cell;
        if(text) tasks.push(text);
      }
      currentTopic.subjects.push({id:subjectId++,name:col1,goal:'',tasks});
    }
  }
  return topics;
}

function mergePhase(phase, newTopics){
  newTopics.forEach(newTopic=>{
    const existing=phase.topics.find(t=>t.name.toLowerCase()===newTopic.name.toLowerCase());
    if(!existing){
      phase.topics.push({
        id:newTopic.id,name:newTopic.name,color:newTopic.color,
        subjects:newTopic.subjects.map(sub=>({
          id:sub.id,name:sub.name,goal:sub.goal,
          tasks:sub.tasks.map((t,i)=>({id:i+1,text:t,done:false,priority:undefined}))
        }))
      });
    } else {
      newTopic.subjects.forEach(newSub=>{
        const exSub=existing.subjects.find(s=>s.name.toLowerCase()===newSub.name.toLowerCase());
        if(!exSub){
          existing.subjects.push({
            id:newSub.id,name:newSub.name,goal:newSub.goal,
            tasks:newSub.tasks.map((t,i)=>({id:i+1,text:t,done:false,priority:undefined}))
          });
        } else {
          exSub.tasks=exSub.tasks.filter(t=>t.text&&t.text!=='undefined');
          newSub.tasks.forEach(taskText=>{
            if(!taskText||taskText==='undefined') return;
            const exTask=exSub.tasks.find(t=>t.text.toLowerCase()===taskText.toLowerCase());
            if(!exTask){
              const maxId=exSub.tasks.reduce((a,t)=>Math.max(a,t.id),0);
              exSub.tasks.push({id:maxId+1,text:taskText,done:false,priority:undefined});
            }
          });
        }
      });
    }
  });
}

function syncFromGSheets(){
  const url='https://docs.google.com/spreadsheets/d/1UpnrOrUUnNAUhWhkDFJhNJFmfR2985p7XrIO7VqE72g/export?format=xlsx';
  const toast=document.getElementById('export-toast');
  toast.textContent='Syncing...';
  toast.style.opacity='1';

  fetch(url)
    .then(r=>{
      if(!r.ok) throw new Error('Could not fetch sheet. Make sure it is publicly shared.');
      return r.arrayBuffer();
    })
    .then(buf=>{
      const wb=XLSX.read(buf,{type:'array'});
      const phaseMap={'Projects PH2':'PH2','Projects PH3':'PH3','Projects PH4':'PH4'};
      let imported=0;
      wb.SheetNames.forEach(sheetName=>{
        const phKey=phaseMap[sheetName];
        if(!phKey) return;
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
        if(!rows||rows.length<2) return;
        const parsed=parseSheet(rows);
        const label=phases[phKey]?phases[phKey].label:sheetName;
        phases[phKey]={label,topics:[]};
        mergePhase(phases[phKey],parsed);
        imported++;
      });
      if(imported===0) throw new Error('No matching sheets found (Projects PH2/3/4/5).');
      _histSetLabel('Sync Google Sheet');
      saveData();
      renderTabs();
      renderTable();
      toast.textContent='Synced!';
      clearTimeout(toast._t);
      toast._t=setTimeout(()=>{toast.style.opacity='0';toast.textContent='Downloaded!';},2500);
    })
    .catch(err=>{
      toast.style.opacity='0';
      alert('Sync failed: '+err.message);
      console.error(err);
    });
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OS Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;padding:1.5rem;overflow-x:auto}
.app{max-width:960px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:500;flex:1}
.phase-tabs{display:flex;gap:5px}
.tab{font-size:12px;padding:4px 11px;border-radius:6px;border:0.5px solid #ccc;background:transparent;color:#666;cursor:pointer}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.tab:hover:not(.active){background:#f5f5f5}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1.25rem}
.metric{background:#f5f5f5;border-radius:6px;padding:0.65rem 0.9rem}
.metric .ml{font-size:11px;color:#888;margin-bottom:2px}
.metric .mv{font-size:18px;font-weight:500;color:#1a1a1a}
table{width:100%;border-collapse:collapse;table-layout:auto}
.col-topic{width:200px;min-width:200px;max-width:200px}
.col-subject{width:200px}
.col-tasks{width:auto}
thead th{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px 6px;border-bottom:0.5px solid #ddd;text-align:left}
.topic-cell{padding:6px 8px 4px;font-size:13px;font-weight:500;color:#1a1a1a;vertical-align:top}
.topic-label{display:flex;align-items:flex-start;gap:6px}
.topic-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.topic-name{word-break:break-word;white-space:normal;line-height:1.35}
.subj-row td{padding:2px 0}
.subj-row:last-child td{padding-bottom:8px}
.subj-cell{padding:3px 8px;font-size:12px;color:#666;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasks-cell{padding:3px 0;vertical-align:middle;overflow:visible;border-left:1px solid #ccc}
.tasks-inline{display:flex;align-items:center;gap:0;flex-wrap:nowrap;overflow:visible}
.task-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:0;border:none;border-right:1px solid #ccc;background:#fff;cursor:pointer;flex-shrink:0;width:200px;transition:background .1s}
.task-chip:hover{background:#f5f5f5}
.task-chip.done{background:#f5f5f5;border-color:transparent}
.chip-check{width:13px;height:13px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-chip.done .chip-check{background:#1D9E75;border-color:#1D9E75}
.task-chip.done .chip-check::after{content:'';display:block;width:3px;height:5px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.chip-label{font-size:12px!important;color:#1a1a1a;white-space:normal;word-break:break-word;line-height:1.3}
.task-chip.done .chip-label{text-decoration:line-through;color:#999}
.task-chip.urgent .chip-label{color:#1a1a1a;font-weight:500}
.task-chip.urgent{border-color:#aaa}
.task-chip.future .chip-label{color:#E8846A}
.task-chip.future{border-color:#F5C4B3}
.task-chip.nextphase .chip-label{color:#7F77DD}
.task-chip.nextphase{border-color:#C5C2F0}
.overflow-badge{flex-shrink:0;font-size:12px;padding:3px 8px;border-radius:6px;background:#f5f5f5;color:#666;cursor:pointer;border:0.5px solid #e0e0e0;white-space:nowrap}
.overflow-badge:hover{background:#e8e8e8}
.goal-pill{font-size:10px;padding:2px 7px;border-radius:6px;background:#E6F1FB;color:#0C447C;white-space:nowrap;display:inline-block;margin-left:4px}
.add-chip{flex-shrink:0;display:flex;align-items:center;padding:3px 8px;border-radius:6px;border:0.5px dashed #ccc;font-size:12px;color:#999;cursor:pointer;white-space:nowrap}
.add-chip:hover{background:#f5f5f5;color:#1a1a1a}
.sep-row td{height:3px;background:#1a1a1a;padding:0}
.add-topic-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.add-topic-row input{font-size:12px;padding:5px 9px;border-radius:6px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a}
.add-topic-row input::placeholder{color:#aaa}
.add-topic-row button{font-size:12px;padding:5px 12px;border-radius:6px;border:0.5px solid #ccc;background:transparent;color:#1a1a1a;cursor:pointer}
.add-topic-row button:hover{background:#f5f5f5}
.popover{position:absolute;z-index:10;background:#fff;border:0.5px solid #ccc;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:200px;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.popover-task{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer}
.popover-task:hover{background:#f5f5f5}
.popover-add{display:flex;gap:6px;margin-top:4px;padding-top:6px;border-top:0.5px solid #eee}
.popover-add input{flex:1;font-size:12px;padding:4px 7px;border-radius:6px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a}
.popover-add input::placeholder{color:#aaa}
.popover-add button{font-size:11px;padding:4px 8px;border-radius:6px;border:0.5px solid #ccc;background:transparent;color:#1a1a1a;cursor:pointer}
.popover-add button:hover{background:#f5f5f5}
.save-indicator{font-size:11px;color:#aaa;margin-left:8px;transition:opacity .3s}
.export-btn{font-size:12px;padding:4px 12px;border-radius:6px;border:0.5px solid #ccc;background:transparent;color:#666;cursor:pointer;margin-left:4px}
.export-btn:hover{background:#f5f5f5;color:#1a1a1a}
.export-toast{font-size:11px;color:#1D9E75;margin-left:6px;transition:opacity .3s}

@media(max-width:768px){
  body{padding:0.75rem}
  .app{max-width:100%}
  .topbar{gap:6px}
  .topbar h1{font-size:15px}
  .export-btn{font-size:11px;padding:3px 8px}
  .phase-tabs{flex-wrap:wrap;gap:4px}
  .tab{font-size:11px;padding:3px 9px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .metric{padding:0.5rem 0.7rem}
  .metric .ml{font-size:10px}
  .metric .mv{font-size:16px}
  thead th{font-size:10px;padding:3px 6px 5px}
  .col-topic{width:100px;min-width:100px;max-width:100px}
  .col-subject{width:100px;min-width:100px}
  .topic-cell{padding:4px 6px 2px;font-size:12px}
  .topic-name{font-size:12px}
  .subj-cell{padding:2px 6px;font-size:11px}
  .task-chip{width:140px;padding:4px 6px}
  .chip-label{font-size:11px}
  .add-chip{font-size:11px;padding:3px 6px;width:80px}
  .overflow-badge{font-size:10px;padding:2px 6px}
  .add-topic-row{flex-wrap:wrap;gap:6px}
  .add-topic-row input{font-size:11px;padding:4px 7px;flex:1;min-width:100px}
  .add-topic-row button{font-size:11px;padding:4px 9px}
  .save-indicator{font-size:10px}
  .popover{min-width:160px;max-width:90vw;left:5vw!important}
  .popover-task span{font-size:11px}
  .popover-add input{font-size:11px}
  .popover-add button{font-size:10px;padding:3px 7px}
  .goal-pill{font-size:9px;padding:1px 5px}
  .sep-row td{height:2px}
}
@media(max-width:480px){
  .topbar{flex-direction:column;align-items:flex-start}
  .topbar h1{margin-bottom:4px}
  .col-topic{width:80px;min-width:80px;max-width:80px}
  .col-subject{width:90px;min-width:90px}
  .task-chip{width:120px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.popover-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0;opacity:0;transition:opacity .15s}
.popover-task:hover .popover-actions{opacity:1}
.act-btn{font-size:10px;padding:2px 6px;border-radius:4px;border:0.5px solid #ddd;background:transparent;cursor:pointer;color:#666}
.act-btn:hover{background:#f0f0f0}
.act-btn.del{color:#c0392b;border-color:#f5c6c6}
.act-btn.del:hover{background:#fdf0f0}
.inline-edit{flex:1;font-size:12px;padding:2px 6px;border-radius:4px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a;outline:none}
.topic-edit-row{display:flex;gap:6px;padding:4px 8px;border-top:0.5px solid #eee;margin-top:4px}
.topic-edit-row input{flex:1;font-size:12px;padding:3px 7px;border-radius:4px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a}
.topic-edit-row button{font-size:11px;padding:3px 8px;border-radius:4px;border:0.5px solid #ccc;background:transparent;color:#1a1a1a;cursor:pointer}
.topic-edit-row button:hover{background:#f5f5f5}
.topic-edit-row button.del{color:#c0392b;border-color:#f5c6c6}
.topic-edit-row button.del:hover{background:#fdf0f0}

.topic-cell{cursor:grab}
.topic-cell:active{cursor:grabbing}
.topic-cell.dragging{opacity:0.4}
.drag-over-top td{border-top:2px solid #378ADD!important}
.drag-over-bottom td{border-bottom:2px solid #378ADD!important}
.drag-handle{display:inline-block;margin-right:6px;color:#ccc;font-size:13px;cursor:grab;user-select:none}
.task-drag-handle{display:inline-block;color:#ccc;font-size:9px;cursor:grab;user-select:none;margin-right:3px;flex-shrink:0;line-height:1}
.task-chip.task-dragging{opacity:0.4}
.task-chip.task-drop-before{box-shadow:inset 3px 0 0 #378ADD}
.task-chip.task-drop-after{box-shadow:inset -3px 0 0 #378ADD}
.subj-drag-handle{display:inline-block;color:#ccc;font-size:9px;cursor:grab;user-select:none;margin-right:4px;line-height:1;vertical-align:middle}
.subj-drop-before td{border-top:2px solid #378ADD!important}
.subj-drop-after td{border-bottom:2px solid #378ADD!important}
.subj-row.subj-dragging .subj-cell,.subj-row.subj-dragging .tasks-cell{opacity:0.4}
#focus-view{display:none;flex-direction:column;max-width:520px}
.focus-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #eee;cursor:default}
.focus-drag-handle{color:#ccc;font-size:10px;cursor:grab;user-select:none;flex-shrink:0;line-height:1}
.focus-item.focus-dragging{opacity:0.4}
.focus-item.focus-drop-before{border-top:2px solid #378ADD;border-bottom:none}
.focus-item.focus-drop-after{border-bottom:2px solid #378ADD}
.focus-item.focus-item-urgent{background:rgba(224,58,58,0.07);border-radius:6px;padding-left:6px;padding-right:6px}.focus-item.focus-item-urgent .focus-task-text{font-weight:500}
.focus-item.focus-cat-nextphase .focus-task-text{color:#7F77DD}
.focus-item.focus-cat-future .focus-task-text{color:#E8846A}
.export-btn.mode-active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.export-btn.mode-active:hover{background:#1a1a1a;color:#fff}

.subj-concluded{text-decoration:line-through;color:#bbb}
.subj-check-badge{width:13px;height:13px;border-radius:50%;background:#1D9E75;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle;margin-right:4px}
.subj-check-badge::after{content:'';display:block;width:3px;height:5px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.act-btn.conclude{color:#1D9E75;border-color:#a8dcc8}
.act-btn.reopen{color:#bbb;border-color:#ddd}

/* ── Phase rail ───────────────────────────────────────────────────────────── */
.phase-rail{display:flex;gap:6px;margin-bottom:1.25rem;max-width:60%}
.rail-item{flex:1;min-width:0;padding:6px 7px;border:0.5px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;transition:background .1s}
.rail-item:hover:not(.active){background:#f5f5f5}
.rail-item.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.rail-name{font-size:11px;font-weight:500;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-dates{display:flex;align-items:center;gap:3px;width:100%}
.rail-date-inp{font-size:9px;border:none;border-bottom:0.5px solid transparent;background:transparent;padding:0;cursor:pointer;width:0;flex:1;min-width:0;outline:none;color:#bbb}
.rail-date-inp:hover,.rail-date-inp:focus{border-bottom-color:#ccc;color:#1a1a1a}
.rail-item.active .rail-date-inp{color:#666;color-scheme:dark}
.rail-item.active .rail-date-inp:hover,.rail-item.active .rail-date-inp:focus{color:#ddd;border-bottom-color:#555}
.rail-sep{font-size:10px;color:#ccc;flex-shrink:0}
.rail-item.active .rail-sep{color:#555}
@media(max-width:768px){
  .rail-item{padding:1px 3px}
  .rail-name{font-size:10px}
  .rail-date-inp{font-size:8px}
}

/* ── Phase goal banner ────────────────────────────────────────────────────── */
.phase-goal-banner{margin-bottom:1.25rem}
.pgb-header{font-size:10px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.pgb-inner{display:flex;flex-direction:column;gap:4px}
.pgb-topic-row{display:flex;align-items:flex-start;gap:6px}
.pgb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.pgb-name{font-size:12px;font-weight:500;min-width:90px;flex-shrink:0;color:#1a1a1a;line-height:1.5}
.pgb-goals-wrap{display:flex;gap:4px;flex-wrap:wrap}
.pgb-goal{font-size:11px;padding:1px 7px;border-radius:4px;background:#f5f5f5;color:#555}
.pgb-no-goal{font-size:11px;color:#ccc;line-height:1.5}
.pgb-toggle{font-size:11px;color:#aaa;cursor:pointer;padding:3px 0;margin-top:1px;align-self:flex-start}
.pgb-toggle:hover{color:#1a1a1a}
.pgb-drag-handle{color:#ccc;font-size:9px;cursor:grab;user-select:none;flex-shrink:0;line-height:1.5;margin-right:2px}
.pgb-drag-handle:active{cursor:grabbing}
.pgb-topic-row.pgb-dragging{opacity:0.4}
.pgb-topic-row.pgb-drop-before{box-shadow:inset 0 2px 0 #378ADD}
.pgb-topic-row.pgb-drop-after{box-shadow:inset 0 -2px 0 #378ADD}
.pgb-goal-input{font-size:11px;padding:1px 7px;border-radius:4px;border:0.5px solid #e0e0e0;background:#f9f9f9;color:#333;outline:none;width:180px;transition:border-color .15s,background .15s}
.pgb-goal-input:focus{border-color:#aaa;background:#fff}
.pgb-goal-input::placeholder{color:#ccc}
.pgb-hide-btn{flex-shrink:0;font-size:10px;color:#ccc;cursor:pointer;padding:1px 4px;border-radius:4px;border:none;background:transparent;line-height:1.5;margin-right:4px}
.pgb-hide-btn:hover{color:#c0392b;background:#fdf0f0}
.pgb-header{cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
.pgb-header:hover{color:#1a1a1a}
.pgb-header-arrow{font-size:9px;color:#bbb;transition:transform .15s}
.pgb-header-arrow.open{transform:rotate(180deg)}
.pgb-header-summary{font-size:10px;color:#bbb;font-weight:400;text-transform:none;letter-spacing:0;margin-left:2px}
.pgb-show-hidden{font-size:11px;color:#bbb;cursor:pointer;padding:2px 0;margin-top:2px}
.pgb-show-hidden:hover{color:#1a1a1a}
.pgb-hidden-row{display:flex;align-items:center;gap:6px;padding:2px 0;opacity:0.5}
.pgb-unhide-btn{font-size:10px;padding:1px 5px;border-radius:4px;border:0.5px solid #ddd;background:transparent;color:#888;cursor:pointer}
.pgb-unhide-btn:hover{background:#f5f5f5;color:#1a1a1a}
@media(max-width:768px){
  .pgb-name{min-width:70px;font-size:11px}
  .pgb-goal{font-size:10px;padding:1px 5px}
  .pgb-toggle{font-size:10px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>OS Projects</h1>
    <span class="save-indicator" id="save-indicator"></span>
    <button class="export-btn" id="file-btn" onclick="toggleFileMenu(event)">File</button>
    <button class="export-btn" onclick="backupData()">&#8681; Backup</button>
    <button class="export-btn" onclick="document.getElementById('restore-input').click()">&#8679; Restore</button>
    <input type="file" id="restore-input" accept=".json" style="display:none" onchange="restoreData(this)">
    <button class="export-btn" onclick="syncFromGSheets()">Sync Google Sheet</button>
    <button class="export-btn" id="show-all-btn" onclick="toggleShowAll()">Show all tasks</button>
    <button class="export-btn" id="show-archived-btn" onclick="toggleShowArchived()" style="display:none">Show archived (0)</button>
    <button class="export-btn" onclick="document.getElementById('xlsx-input').click()">Import Excel</button>
    <input type="file" id="xlsx-input" accept=".xlsx" style="display:none" onchange="importXlsx(this)">
    <button class="export-btn" onclick="exportNowTasks()">Export “now” tasks</button>
    <button class="export-btn" id="focus-btn" onclick="toggleFocusMode()">Focus</button>
    <button class="export-btn" id="next-btn" onclick="toggleNextMode()">Next phase</button>
    <button class="export-btn" id="later-btn" onclick="toggleLaterMode()">Later</button>
    <button class="export-btn" onclick="forceReset()" style="color:#c0392b;border-color:#c0392b" title="Reload all default data">Reset data</button>
    <button class="export-btn" id="conclude-phase-btn" onclick="concludePhase()">Conclude phase →</button>
    <button class="export-btn" id="reopen-phase-btn" onclick="reopenPhase()" style="display:none">Re-open phase</button>
    <button class="export-btn" onclick="deletePhase()" style="color:#c0392b;border-color:#c0392b">Delete phase</button>
    <span class="export-toast" id="export-toast" style="opacity:0">Downloaded!</span>
  </div>
  <div class="phase-rail" id="phase-rail"></div>
  <div class="phase-goal-banner" id="phase-goal-banner"></div>
  <div class="metrics" id="metrics"></div>
  <table>
    <thead>
      <tr>
        <th class="col-topic">Topic</th>
        <th class="col-subject">Subject</th>
        <th class="col-tasks" style="padding:0">
          
        </th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="focus-view"></div>
  <div class="add-topic-row">
    <input id="new-topic-inp" placeholder="New topic..." />
    <input id="new-subj-inp" placeholder="Subject..." />
    <button onclick="addTopic()">+ Add topic</button>
  </div>
  <div id="popover-wrap" style="position:fixed;inset:0;display:none;z-index:9" onclick="closePopover()"></div>
  <div id="popover" class="popover" style="display:none"></div>
</div>

function loadData(){
  try{
    const saved=localStorage.getItem(LS_KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      const hasData=Object.keys(defaultData).some(k=>
        parsed[k]&&parsed[k].topics&&parsed[k].topics.length>0
      );
      if(hasData) return parsed;
    }
  }catch(e){}
  return resetToDefault();
}

function resetToDefault(){
  const fresh=JSON.parse(JSON.stringify(defaultData));
  try{localStorage.setItem(LS_KEY,JSON.stringify(fresh));}catch(e){}
  return fresh;
}

let phases=loadData();

function saveData(){
  // localStorage stays synchronous: data survives a tab close even if the
  // debounced remote write has not fired yet.
  try{localStorage.setItem(LS_KEY,JSON.stringify(phases));}catch(e){}
  const ind=document.getElementById('save-indicator');
  if(ind){ind.textContent='Saving...';ind.style.opacity='1';}
  // Debounced: coalesces rapid mutations into a single Supabase upsert.
  clearTimeout(_sbSaveTimer);
  _sbSaveTimer=setTimeout(()=>{
    sb.from('os_projects').upsert({id:DEVICE_ID,data:JSON.stringify(phases),updated_at:new Date().toISOString()})
      .then(({error})=>{
        if(!ind) return;
        if(error){ind.textContent='Saved locally';console.warn('Supabase save error:',error);}
        else ind.textContent='Synced';
        clearTimeout(ind._t);
        ind._t=setTimeout(()=>{ind.style.opacity='0';},1500);
      });
  },300);
}

// ── Undo / Redo / History ────────────────────────────────────────────────────
// One wrapper around saveData() records every mutation as a JSON snapshot, so
// none of the existing saveData() call sites need to change. Only `currentPhase`
// travels with a snapshot; every other UI-state global is deliberately excluded.

const HISTORY_LIMIT=50;
let _histPast=[], _histFuture=[], _histCur=null, _histBaseline=null, _histSuspend=false, _histLabel=null, _histLabelTimer=null;

/**
 * _histCounts — count every node in a parsed phases tree.
 * Pure: takes the parsed object as an argument and reads no globals.
 */
function _histCounts(obj){
  const out={phases:0,topics:0,subjects:0,tasks:0,done:0};
  if(!obj||typeof obj!=='object') return out;
  Object.keys(obj).forEach(pk=>{
    const ph=obj[pk];
    if(!ph||typeof ph!=='object') return;
    out.phases++;
    const topics=Array.isArray(ph.topics)?ph.topics:[];
    topics.forEach(tp=>{
      out.topics++;
      const subs=(tp&&Array.isArray(tp.subjects))?tp.subjects:[];
      subs.forEach(su=>{
        out.subjects++;
        const tasks=(su&&Array.isArray(su.tasks))?su.tasks:[];
        tasks.forEach(tk=>{out.tasks++;if(tk&&tk.done) out.done++;});
      });
    });
  });
  return out;
}

/**
 * _histDiffLabel — short human label describing what changed between two
 * JSON snapshots. Pure: string in, string out. Unparseable input → 'Edit'.
 */
function _histDiffLabel(prevJson,nextJson){
  let a,b;
  try{a=_histCounts(JSON.parse(prevJson));b=_histCounts(JSON.parse(nextJson));}
  catch(e){return 'Edit';}
  if(b.phases!==a.phases)   return b.phases>a.phases?'Phase added':'Phase deleted';
  if(b.topics!==a.topics)   return b.topics>a.topics?'Topic added':'Topic deleted';
  if(b.subjects!==a.subjects) return b.subjects>a.subjects?'Subject added':'Subject deleted';
  if(b.tasks!==a.tasks){
    const d=b.tasks-a.tasks, verb=d>0?'added':'deleted', n=Math.abs(d);
    return n>1?(n+' tasks '+verb):('Task '+verb);
  }
  if(b.done!==a.done)       return b.done>a.done?'Task completed':'Task reopened';
  return 'Edit';
}

/** _histSnap — snapshot of the live state. Not pure (reads phases/currentPhase). */
function _histSnap(label){
  return {json:JSON.stringify(phases),phase:currentPhase,label:label||'Edit',ts:Date.now()};
}

/** _histInit — (re)seed history and the Revert baseline from the live state. */
function _histInit(){
  _histPast=[]; _histFuture=[];
  _histCur=_histSnap('Loaded');
  _histBaseline=_histCur;
  _histLabel=null;
}

/** _histRebase — re-anchor the Revert baseline without discarding undo history.
 *  Used when the async Supabase load lands after the user has already edited. */
function _histRebase(){
  _histBaseline=_histSnap('Loaded');
  _histCur=_histBaseline;
  _histLabel=null;
}

// Wrap saveData: `saveData` is a function declaration, so reassigning it here
// means all later call sites (all of which run at event time) hit the wrapper.
const _origSaveData=saveData;
saveData=function(){
  if(!_histSuspend){
    const json=JSON.stringify(phases);
    if(_histCur && _histCur.json!==json){
      _histPast.push(_histCur);
      if(_histPast.length>HISTORY_LIMIT) _histPast.shift();
      _histFuture.length=0;              // a new branch invalidates redo
    }
    if(!_histCur || _histCur.json!==json){
      _histCur={json:json,phase:currentPhase,
                label:_histLabel || _histDiffLabel(_histCur?_histCur.json:json,json),
                ts:Date.now()};
    }
    _histLabel=null; clearTimeout(_histLabelTimer);
  }
  _origSaveData();
};

/** _histApply — restore a snapshot and repaint. Recording is suspended, but the
 *  restored state is still persisted (the wrapper always delegates). */
function _histApply(entry){
  if(!entry) return false;
  // Keep a rollback copy: if the snapshot is unrenderable we must not leave the
  // app on a half-applied state with a blank table.
  const _prevJson=JSON.stringify(phases), _prevPhase=currentPhase;
  _histSuspend=true;
  try{
    phases=JSON.parse(entry.json);
    if(entry.phase && phases[entry.phase]) currentPhase=entry.phase;
    if(!phases[currentPhase]){
      const ks=getSortedPhaseKeys(phases);
      if(ks.length) currentPhase=ks[0];
      // An empty phases object has no valid phase to show; refuse the snapshot
      // rather than letting renderTable() throw on phases[undefined].topics.
      else throw new Error('snapshot contains no phases');
    }
    closePopover(); closeWizard();
    saveData();
    // keep LS_PHASE_KEY in step with the restored phase; guarded so a failure here
    // can never trigger the rollback path below.
    try{ if(typeof saveCurrentPhase==="function") saveCurrentPhase(); }catch(e){}
    renderTabs(); renderTable(); renderColNumbers();
    return true;
  }catch(err){
    console.error('History: could not apply snapshot, rolling back.',err);
    try{
      phases=JSON.parse(_prevJson); currentPhase=_prevPhase;
      renderTabs(); renderTable(); renderColNumbers();
    }catch(e2){ console.error('History: rollback also failed.',e2); }
    return false;
  }finally{ _histSuspend=false; }
}

function _histToast(msg){
  const toast=document.getElementById('export-toast');
  if(!toast) return;
  toast.textContent=msg;
  toast.style.opacity='1';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{toast.style.opacity='0';toast.textContent='Downloaded!';},1400);
}

function undo(){
  if(_histPast.length===0){_histToast('Nothing to undo');return false;}
  const label=_histCur?_histCur.label:'';
  _histFuture.unshift(_histCur);
  _histCur=_histPast.pop();
  _histApply(_histCur);
  _histToast('Undo: '+label);
  renderHistoryPanel();
  return true;
}

function redo(){
  if(_histFuture.length===0){_histToast('Nothing to redo');return false;}
  _histPast.push(_histCur);
  if(_histPast.length>HISTORY_LIMIT) _histPast.shift();
  _histCur=_histFuture.shift();
  _histApply(_histCur);
  _histToast('Redo: '+_histCur.label);
  renderHistoryPanel();
  return true;
}

}

function closeHistoryPanel(){const el=document.getElementById('history-panel'); if(el) el.remove();}

function _histList(){return [..._histPast,_histCur,..._histFuture].filter(Boolean);}

function renderHistoryPanel(){
  const list=document.getElementById('history-list');
  if(!list) return;
  list.innerHTML='';
  const all=_histList();
  const curIdx=_histPast.length;
  if(all.length<=1){
    const empty=document.createElement('div');
    empty.style.cssText='font-size:12px;color:#888;padding:8px 4px';
    empty.textContent='No edits yet this session.';
    list.appendChild(empty);
    return;
  }
  all.forEach((entry,i)=>{
    const isCur=i===curIdx, isFuture=i>curIdx;
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border-radius:4px;cursor:pointer;color:'+(isCur?'#1a1a1a':(isFuture?'#aaa':'#666'))+(isCur?';font-weight:500':'');
    row.onmouseenter=()=>{row.style.background='#f5f5f5';};
    row.onmouseleave=()=>{row.style.background='transparent';};
    const mark=document.createElement('span');
    mark.style.cssText='width:8px;flex:0 0 8px;color:#1D9E75';
    mark.textContent=isCur?'•':'';
    const lab=document.createElement('span');
    lab.style.cssText='flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    lab.textContent=entry.label||'Edit';
    const time=document.createElement('span');
    time.style.cssText='font-size:10px;color:#aaa;flex:0 0 auto';
    time.textContent=entry.ts?new Date(entry.ts).toLocaleTimeString():'';
    row.appendChild(mark);row.appendChild(lab);row.appendChild(time);
    row.onclick=()=>{
      if(i===curIdx) return;
      const combined=_histList();
      _histPast=combined.slice(0,i);
      _histFuture=combined.slice(i+1);
      _histCur=combined[i];
      _histApply(_histCur);
      renderHistoryPanel();
    };
    list.appendChild(row);
  });
}

// ── Revert to the state the page was loaded with ─────────────────────────────
function revertToSaved(){
  closeFileMenu();
  if(!_histBaseline){alert('No saved state is available to revert to yet.');return;}
  if(!confirm('Discard all changes made since this page was loaded?')) return;
  if(_histCur && _histCur.json===_histBaseline.json){_histToast('Already at the saved state');return;}
  if(_histCur){
    _histPast.push(_histCur);
    if(_histPast.length>HISTORY_LIMIT) _histPast.shift();
  }
  _histFuture.length=0;
  _histCur={json:_histBaseline.json,phase:_histBaseline.phase,label:'Revert to saved',ts:Date.now()};
  _histApply(_histCur);
  _histToast('Reverted to saved');
  renderHistoryPanel();
}

// ── Keyboard: Ctrl/Cmd+Z undo, Ctrl/Cmd+Y or Ctrl/Cmd+Shift+Z redo, Ctrl+H ──
// Ctrl+R is intentionally NOT bound: it must stay browser reload.
document.addEventListener('keydown',(e)=>{
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='Escape'){
    if(document.getElementById('file-menu')){closeFileMenu();return;}
    if(document.getElementById('history-panel')){closeHistoryPanel();return;}
    return;
  }
  const mod=e.ctrlKey||e.metaKey;
  if(!mod) return;
  const k=(e.key||'').toLowerCase();
  if(k==='z' && !e.shiftKey){e.preventDefault(); undo();}
  else if(k==='y' || (k==='z'&&e.shiftKey)){e.preventDefault(); redo();}
  else if(k==='h'){e.preventDefault(); openHistoryPanel();}
});

 *  confirm() that returns before saving) cannot mislabel a later, unrelated edit. */

async function loadFromSupabase(){
  try{
    // Race the query against a 2s timeout: without this a hung connection
    // blocks the startup IIFE forever and the page never renders.
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Supabase load timeout')),2000));
    const query=sb.from('os_projects').select('data').eq('id',DEVICE_ID).single();
    const {data,error}=await Promise.race([query,timeout]);
    if(error||!data) return null;
    const parsed=JSON.parse(data.data);
    const hasData=Object.keys(defaultData).some(k=>parsed[k]&&parsed[k].topics&&parsed[k].topics.length>0);
    return hasData?parsed:null;
  }catch(e){return null;}
}

function allTasks(ph){return phases[ph].topics.flatMap(t=>t.subjects.flatMap(s=>s.tasks))}

// Returns phase keys sorted by numeric suffix (PH2 < PH3 < PH4 …)
function getSortedPhaseKeys(phasesData){
  return Object.keys(phasesData||phases).sort((a,b)=>{
    const na=parseInt(a.replace(/\D/g,''))||0;
    const nb=parseInt(b.replace(/\D/g,''))||0;
    return na-nb;
  });
}
window.getSortedPhaseKeys=getSortedPhaseKeys;

// Format "YYYY-MM" → "Jan 2025"
function fmtMonth(ym){
  if(!ym) return '';
  const parts=ym.split('-');
  if(parts.length<2) return ym;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m=parseInt(parts[1],10);
  return (months[m-1]||ym)+' '+parts[0];
}
window.fmtMonth=fmtMonth;

/**
 * Phase Goal Banner
 * ─────────────────
 * Renders a ranked list of topics + their subject goals for the active phase,
 * placed between the phase rail and the metrics row.
 *
 * Ranking:
 *  - Order stored in phases[phaseKey].goalBannerOrder (array of topic IDs).
 *  - Independent from main table order; dragging here does not affect the table.
 *  - getOrderedBannerTopics(ph) returns topics sorted by goalBannerOrder,
 *    appending any not yet in the list at the end.
 *
 * Visibility:
 *  - GOAL_LIMIT (3) topics shown by default.
 *  - toggleAllGoals() reveals/hides the rest.
 *  - showAllGoals resets to false on setPhase().
 *
 * Data: goals live on subject.goal (string). Topics with no non-empty goals
 *       display "—". Archived topics are excluded.
 *
 * Migration: no data changes to existing records — goalBannerOrder is additive.
 */
const GOAL_LIMIT = 3;
let showAllGoals = false;
let _pgbDragTopicId = null;

/** Pure — returns topics sorted by ph.goalBannerOrder, unknowns appended. */
function getOrderedBannerTopics(ph) {
  const topics = (ph.topics || []).filter(t => !t.archived);
  const order = ph.goalBannerOrder || [];
  const seen = new Set();
  const ordered = [];
  order.forEach(id => {
    const t = topics.find(x => x.id === id);
    if (t && !seen.has(id)) { ordered.push(t); seen.add(id); }
  });
  topics.forEach(t => { if (!seen.has(t.id)) ordered.push(t); });
  return ordered;
}
window.getOrderedBannerTopics = getOrderedBannerTopics;

let _showHidden = false;
let _bannerExpanded = false;

function _pgbSaveGoal(topicId, value) {
  if (!phases[currentPhase].bannerGoals) phases[currentPhase].bannerGoals = {};
  phases[currentPhase].bannerGoals[topicId] = value;
  saveData();
}

function _pgbHide(topicId) {
  const ph = phases[currentPhase];
  if (!ph.bannerHidden) ph.bannerHidden = [];
  if (!ph.bannerHidden.includes(topicId)) ph.bannerHidden.push(topicId);
  saveData();
  renderGoalBanner();
}

function _pgbUnhide(topicId) {
  const ph = phases[currentPhase];
  ph.bannerHidden = (ph.bannerHidden || []).filter(id => id !== topicId);
  saveData();
  renderGoalBanner();
}

function renderGoalBanner() {
  const banner = document.getElementById('phase-goal-banner');
  if (!banner) return;
  const ph = phases[currentPhase];
  if (!ph) { banner.innerHTML = ''; return; }

  const hidden = ph.bannerHidden || [];
  const goals  = ph.bannerGoals  || {};
  const allOrdered = getOrderedBannerTopics(ph);
  const visible = allOrdered.filter(t => !hidden.includes(t.id));
  const hiddenTopics = allOrdered.filter(t => hidden.includes(t.id));

  banner.innerHTML = '';

  // ── Collapsed header (always visible) ──────────────────────────────────
  const header = document.createElement('div');
  header.className = 'pgb-header';

  const headerLabel = document.createElement('span');
  headerLabel.textContent = 'Phase Goals';
  header.appendChild(headerLabel);

  if (!_bannerExpanded) {
    const summary = document.createElement('span');
    summary.className = 'pgb-header-summary';
    summary.textContent = `— ${visible.length} topic${visible.length !== 1 ? 's' : ''}`;
    header.appendChild(summary);
  }

  const arrow = document.createElement('span');
  arrow.className = 'pgb-header-arrow' + (_bannerExpanded ? ' open' : '');
  arrow.textContent = '▾';
  header.appendChild(arrow);

  header.onclick = () => { _bannerExpanded = !_bannerExpanded; renderGoalBanner(); };
  banner.appendChild(header);

  if (!_bannerExpanded) return; // collapsed: only show the 1-line header

  // ── Expanded body ───────────────────────────────────────────────────────
  const shown = showAllGoals ? visible : visible.slice(0, GOAL_LIMIT);
  const hasMore = visible.length > GOAL_LIMIT;

  const inner = document.createElement('div');
  inner.className = 'pgb-inner';
  banner.appendChild(inner);

  shown.forEach(topic => {
    const row = document.createElement('div');
    row.className = 'pgb-topic-row';
    row.draggable = true;
    row.dataset.tid = topic.id;

    // drag handle
    const handle = document.createElement('span');
    handle.className = 'pgb-drag-handle';
    handle.title = 'Drag to reorder';
    handle.textContent = '⠿';
    row.appendChild(handle);

    // color dot
    const dot = document.createElement('div');
    dot.className = 'pgb-dot';
    dot.style.background = topic.color;
    row.appendChild(dot);

    // hide button — next to the name
    const hideBtn = document.createElement('button');
    hideBtn.className = 'pgb-hide-btn';
    hideBtn.title = 'Hide from banner';
    hideBtn.textContent = '×';
    hideBtn.onclick = (e) => { e.stopPropagation(); _pgbHide(topic.id); };

    // topic name
    const name = document.createElement('span');
    name.className = 'pgb-name';
    name.textContent = topic.name;
    row.appendChild(name);

    row.appendChild(hideBtn); // immediately after name

    // manual goal input
    const inp = document.createElement('input');
    inp.className = 'pgb-goal-input';
    inp.placeholder = 'Goal…';
    inp.value = goals[topic.id] || '';
    inp.addEventListener('blur',  () => _pgbSaveGoal(topic.id, inp.value.trim()));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    inp.addEventListener('dragstart', e => e.stopPropagation());
    row.appendChild(inp);

    // drag-and-drop
    row.addEventListener('dragstart', e => {
      _pgbDragTopicId = topic.id;
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('pgb-dragging');
    });
    row.addEventListener('dragend', () => {
      _pgbDragTopicId = null;
      row.classList.remove('pgb-dragging');
      inner.querySelectorAll('.pgb-drop-before,.pgb-drop-after')
        .forEach(el => el.classList.remove('pgb-drop-before', 'pgb-drop-after'));
    });
    row.addEventListener('dragover', e => {
      if (_pgbDragTopicId === null || _pgbDragTopicId === topic.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      inner.querySelectorAll('.pgb-drop-before,.pgb-drop-after')
        .forEach(el => el.classList.remove('pgb-drop-before', 'pgb-drop-after'));
      const rect = row.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) row.classList.add('pgb-drop-before');
      else row.classList.add('pgb-drop-after');
    });
    row.addEventListener('dragleave', e => {
      if (!e.relatedTarget || !row.contains(e.relatedTarget))
        row.classList.remove('pgb-drop-before', 'pgb-drop-after');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('pgb-drop-before', 'pgb-drop-after');
      if (_pgbDragTopicId === null || _pgbDragTopicId === topic.id) return;
      const orderedVisible = getOrderedBannerTopics(phases[currentPhase])
        .filter(t => !(phases[currentPhase].bannerHidden||[]).includes(t.id));
      const fromIdx = orderedVisible.findIndex(t => t.id === _pgbDragTopicId);
      const toIdx   = orderedVisible.findIndex(t => t.id === topic.id);
      if (fromIdx === -1 || toIdx === -1) return;
      const rect = row.getBoundingClientRect();
      const after = e.clientY >= rect.top + rect.height / 2;
      const ids = orderedVisible.map(t => t.id);
      const [moved] = ids.splice(fromIdx, 1);
      const adj = fromIdx < toIdx ? toIdx - 1 : toIdx;
      ids.splice(after ? adj + 1 : adj, 0, moved);
      const hiddenIds = (phases[currentPhase].bannerHidden||[]);
      phases[currentPhase].goalBannerOrder = [...ids, ...hiddenIds];
      saveData();
      renderGoalBanner();
    });

    inner.appendChild(row);
  });

  // show-more toggle
  if (hasMore) {
    const toggle = document.createElement('div');
    toggle.className = 'pgb-toggle';
    toggle.textContent = showAllGoals ? 'Show less ↑' : `Show all ${visible.length} topics ↓`;
    toggle.onclick = toggleAllGoals;
    inner.appendChild(toggle);
  }

  // hidden topics section
  if (hiddenTopics.length) {
    const showHiddenLink = document.createElement('div');
    showHiddenLink.className = 'pgb-show-hidden';
    showHiddenLink.textContent = _showHidden
      ? 'Hide hidden topics ↑'
      : `${hiddenTopics.length} hidden topic${hiddenTopics.length > 1 ? 's' : ''} ▾`;
    showHiddenLink.onclick = () => { _showHidden = !_showHidden; renderGoalBanner(); };
    inner.appendChild(showHiddenLink);

    if (_showHidden) {
      hiddenTopics.forEach(topic => {
        const hrow = document.createElement('div');
        hrow.className = 'pgb-hidden-row';
        const dot = document.createElement('div');
        dot.className = 'pgb-dot';
        dot.style.background = topic.color;
        hrow.appendChild(dot);
        const nm = document.createElement('span');
        nm.className = 'pgb-name';
        nm.textContent = topic.name;
        hrow.appendChild(nm);
        const unhideBtn = document.createElement('button');
        unhideBtn.className = 'pgb-unhide-btn';
        unhideBtn.textContent = 'Unhide';
        unhideBtn.onclick = () => _pgbUnhide(topic.id);
        hrow.appendChild(unhideBtn);
        inner.appendChild(hrow);
      });
    }
  }
}
window.renderGoalBanner = renderGoalBanner;

function toggleAllGoals() {
  showAllGoals = !showAllGoals;
  renderGoalBanner();
}
window.toggleAllGoals = toggleAllGoals;

function renderTabs(){
  const rail=document.getElementById('phase-rail');
  if(!rail) return;
  rail.innerHTML='';

  getSortedPhaseKeys().forEach(k=>{
    const ph=phases[k];
    if(!ph) return;
    const isActive=k===currentPhase;

    const item=document.createElement('div');
    item.className='rail-item'+(isActive?' active':'');
    item.onclick=()=>setPhase(k);

    // Phase name + status
    const nameDiv=document.createElement('div');
    nameDiv.className='rail-name';
    nameDiv.textContent=ph.label+(ph.concluded?' ✓':'');
    item.appendChild(nameDiv);

    // Date range (month inputs, stop propagation so they don't switch phase)
    const datesDiv=document.createElement('div');
    datesDiv.className='rail-dates';
    datesDiv.onclick=(e)=>e.stopPropagation();

    const startInp=document.createElement('input');
    startInp.type='month';
    startInp.className='rail-date-inp';
    startInp.value=ph.startDate||'';
    startInp.title='Start';
    startInp.onchange=()=>{phases[k].startDate=startInp.value;saveData();};

    const sep=document.createElement('span');
    sep.className='rail-sep';
    sep.textContent='→';

    const endInp=document.createElement('input');
    endInp.type='month';
    endInp.className='rail-date-inp';
    endInp.value=ph.endDate||'';
    endInp.title='End';
    endInp.onchange=()=>{phases[k].endDate=endInp.value;saveData();};

    datesDiv.appendChild(startInp);
    datesDiv.appendChild(sep);
    datesDiv.appendChild(endInp);
    item.appendChild(datesDiv);
    rail.appendChild(item);
  });

  const concluded=!!(phases[currentPhase]&&phases[currentPhase].concluded);
  const reopenBtn=document.getElementById('reopen-phase-btn');
  const concludeBtn=document.getElementById('conclude-phase-btn');
  if(reopenBtn) reopenBtn.style.display=concluded?'':'none';
  if(concludeBtn) concludeBtn.style.display=concluded?'none':'';
}

function renderMetrics(){
  const all=allTasks(currentPhase).length,done=allTasks(currentPhase).filter(t=>t.done).length;
  const pct=all?Math.round(done/all*100):0;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="ml">Topics</div><div class="mv">${phases[currentPhase].topics.length}</div></div>
    <div class="metric"><div class="ml">Total tasks</div><div class="mv">${all}</div></div>
    <div class="metric"><div class="ml">Done</div><div class="mv">${done}</div></div>
    <div class="metric"><div class="ml">Progress</div><div class="mv">${pct}%</div></div>
  `;
}

function renderTable(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  const ph=phases[currentPhase];
  const archivedCount=ph.topics.filter(t=>t.archived).length;
  const archBtn=document.getElementById('show-archived-btn');
  if(archBtn){
    if(archivedCount>0){archBtn.style.display='';archBtn.textContent=(showArchived?'Hide archived':'Show archived')+` (${archivedCount})`;}
    else{archBtn.style.display='none';showArchived=false;}
  }
  const visibleTopics=showArchived?ph.topics:ph.topics.filter(t=>!t.archived);
  visibleTopics.forEach((topic,ti)=>{
    topic.subjects.forEach((sub,si)=>{
      const isFirst=si===0;
      const isLast=si===topic.subjects.length-1;
      const tr=document.createElement('tr');
      tr.className='subj-row';
      if(isFirst){
        // inject column number row for this topic
        const numTr=document.createElement('tr');
        numTr.className='num-row';
        const numEmpty1=document.createElement('td');
        const numEmpty2=document.createElement('td');
        const numTd=document.createElement('td');
        numTd.style.cssText='padding:1px 0;border-left:1px solid #ccc';
        const maxSubTasks=showAllTasks?Math.max(0,...topic.subjects.map(s=>s.tasks.filter(tk=>!tk.done).length)):3;
        const chipW=window.innerWidth<=480?120:window.innerWidth<=768?140:200;
        let numHtml='<div style="display:flex;gap:0">';
        for(let n=1;n<=maxSubTasks;n++) numHtml+=`<div style="width:${chipW}px;flex-shrink:0;font-size:10px;color:#bbb;text-align:center;border-right:1px solid #ccc;padding:1px 0">${n}</div>`;
        numHtml+='</div>';
        numTd.innerHTML=numHtml;
        numTr.appendChild(numEmpty1);
        numTr.appendChild(numEmpty2);
        numTr.appendChild(numTd);
        tbody.appendChild(numTr);

        const topicTd=document.createElement('td');
        topicTd.className='topic-cell';
        topicTd.rowSpan=topic.subjects.length;
        const topicTotal=topic.subjects.flatMap(s=>s.tasks).length;
        const topicDone=topic.subjects.flatMap(s=>s.tasks).filter(t=>t.done).length;
        topicTd.innerHTML=`<div class="topic-label"><span class="drag-handle" title="Drag to reorder">&#8597;</span><div class="topic-dot" style="background:${topic.color}"></div><span class="topic-name">${topic.name}</span></div><div style="font-size:10px;color:#aaa;margin-top:2px;padding-left:14px">${topicDone}/${topicTotal}</div>`;
        topicTd.draggable=true;
        topicTd.dataset.tid=topic.id;
        topicTd.addEventListener('dragstart',(e)=>{
          e.dataTransfer.setData('tid',topic.id);
          topicTd.classList.add('dragging');
          e.dataTransfer.effectAllowed='move';
        });
        topicTd.addEventListener('dragend',()=>{
          topicTd.classList.remove('dragging');
          document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
        });
        topicTd.addEventListener('dragover',(e)=>{
          if(_dragSubjectInfo) return;
          e.preventDefault();
          document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
          const rect=topicTd.getBoundingClientRect();
          const mid=rect.top+rect.height/2;
          if(e.clientY<mid) tr.classList.add('drag-over-top');
          else tr.classList.add('drag-over-bottom');
          e.dataTransfer.dropEffect='move';
        });
        topicTd.addEventListener('drop',(e)=>{
          e.preventDefault();
          const fromId=parseInt(e.dataTransfer.getData('tid'));
          const toId=topic.id;
          if(fromId===toId) return;
          const ph=phases[currentPhase];
          const fromIdx=ph.topics.findIndex(t=>t.id===fromId);
          const toIdx=ph.topics.findIndex(t=>t.id===toId);
          const rect=topicTd.getBoundingClientRect();
          const mid=rect.top+rect.height/2;
          const after=e.clientY>=mid;
          const [moved]=ph.topics.splice(fromIdx,1);
          const newIdx=ph.topics.findIndex(t=>t.id===toId);
          ph.topics.splice(after?newIdx+1:newIdx,0,moved);
          saveData();
          renderTable();
          renderColNumbers();
        });
        tr.appendChild(topicTd);
      }
      const subjTd=document.createElement('td');
      subjTd.className='subj-cell';
      const subDone=sub.tasks.filter(t=>t.done).length;
      const subTotal=sub.tasks.length;
      const countStr=subTotal>0?` <span style="font-size:10px;color:#aaa">${subDone}/${subTotal}</span>`:'';
      const concludedBadge=sub.concluded?`<span class="subj-check-badge"></span>`:'';
      const concludedClass=sub.concluded?' class="subj-concluded"':'';
      subjTd.innerHTML=concludedBadge+`<span${concludedClass}>${sub.name}</span>`+countStr+(sub.goal?`<span class="goal-pill">${sub.goal}</span>`:'');
      const subjHandle=document.createElement('span');
      subjHandle.className='subj-drag-handle';
      subjHandle.title='Drag to reorder';
      subjHandle.textContent='⠿';
      subjTd.prepend(subjHandle);
      subjTd.draggable=true;
      subjTd.addEventListener('dragstart',e=>{
        _dragSubjectInfo={phaseKey:currentPhase,topicId:topic.id,fromIdx:si};
        e.dataTransfer.effectAllowed='move';
        tr.classList.add('subj-dragging');
        e.stopPropagation();
      });
      subjTd.addEventListener('dragend',()=>{
        _dragSubjectInfo=null;
        tr.classList.remove('subj-dragging');
        document.querySelectorAll('.subj-drop-before,.subj-drop-after').forEach(el=>el.classList.remove('subj-drop-before','subj-drop-after'));
      });
      tr.addEventListener('dragover',e=>{
        if(!_dragSubjectInfo||_dragSubjectInfo.topicId!==topic.id) return;
        e.preventDefault();e.stopPropagation();
        e.dataTransfer.dropEffect='move';
        document.querySelectorAll('.subj-drop-before,.subj-drop-after').forEach(el=>el.classList.remove('subj-drop-before','subj-drop-after'));
        const rect=tr.getBoundingClientRect();
        if(e.clientY<rect.top+rect.height/2) tr.classList.add('subj-drop-before');
        else tr.classList.add('subj-drop-after');
      });
      tr.addEventListener('dragleave',e=>{
        if(!e.relatedTarget||!tr.contains(e.relatedTarget)) tr.classList.remove('subj-drop-before','subj-drop-after');
      });
      tr.addEventListener('drop',e=>{
        e.preventDefault();e.stopPropagation();
        tr.classList.remove('subj-drop-before','subj-drop-after');
        if(!_dragSubjectInfo||_dragSubjectInfo.topicId!==topic.id) return;
        const fromIdx=_dragSubjectInfo.fromIdx;
        if(fromIdx===si) return;
        const rect=tr.getBoundingClientRect();
        const after=e.clientY>=rect.top+rect.height/2;
        phases=moveSubject(phases,currentPhase,topic.id,fromIdx,si,after);
        saveData();renderTable();renderColNumbers();
      });
      tr.appendChild(subjTd);

      const tasksTd=document.createElement('td');
      tasksTd.className='tasks-cell';
      const wrap=document.createElement('div');
      wrap.className='tasks-inline';
      wrap.id=`row-${topic.id}-${sub.id}`;
      (showAllTasks||sub.concluded?sub.tasks:sub.tasks.filter(t=>!t.done)).slice(0,showAllTasks?undefined:3).forEach(t=>{
        const chip=document.createElement('div');
        const pClass=(t.done||sub.concluded)?' done':t.priority==='urgent'?' urgent':t.priority==='future'?' future':t.priority==='nextphase'?' nextphase':'';
        chip.className='task-chip'+pClass;
        chip.innerHTML=`<span class="task-drag-handle" title="Drag to reorder">⠿</span><div class="chip-check"></div><span class="chip-label">${t.text}</span>`;
        chip.onclick=(e)=>{if(e.target.closest('.task-drag-handle')) return; toggleTask(topic.id,sub.id,t.id);};
        chip.oncontextmenu=(e)=>{e.preventDefault();cyclePriority(topic.id,sub.id,t.id);};
        chip.title='Right-click to set priority';
        const realIdx=sub.tasks.findIndex(tk=>tk.id===t.id);
        chip.draggable=true;
        chip.addEventListener('dragstart',e=>{
          _dragTaskInfo={phaseKey:currentPhase,topicId:topic.id,subjectId:sub.id,taskIdx:realIdx};
          e.dataTransfer.effectAllowed='move';
          chip.classList.add('task-dragging');
        });
        chip.addEventListener('dragend',()=>{
          _dragTaskInfo=null;
          chip.classList.remove('task-dragging');
          document.querySelectorAll('.task-drop-before,.task-drop-after').forEach(el=>el.classList.remove('task-drop-before','task-drop-after'));
        });
        chip.addEventListener('dragover',e=>{
          if(!_dragTaskInfo||_dragTaskInfo.topicId!==topic.id||_dragTaskInfo.subjectId!==sub.id) return;
          e.preventDefault();
          e.dataTransfer.dropEffect='move';
          document.querySelectorAll('.task-drop-before,.task-drop-after').forEach(el=>el.classList.remove('task-drop-before','task-drop-after'));
          const rect=chip.getBoundingClientRect();
          if(e.clientX<rect.left+rect.width/2) chip.classList.add('task-drop-before');
          else chip.classList.add('task-drop-after');
        });
        chip.addEventListener('dragleave',()=>{chip.classList.remove('task-drop-before','task-drop-after');});
        chip.addEventListener('drop',e=>{
          e.preventDefault();
          chip.classList.remove('task-drop-before','task-drop-after');
          if(!_dragTaskInfo||_dragTaskInfo.topicId!==topic.id||_dragTaskInfo.subjectId!==sub.id) return;
          const fromIdx=_dragTaskInfo.taskIdx;
          if(fromIdx===realIdx) return;
          const rect=chip.getBoundingClientRect();
          const after=e.clientX>=rect.left+rect.width/2;
          phases=moveTask(phases,currentPhase,topic.id,sub.id,fromIdx,realIdx,after);
          saveData();renderTable();renderColNumbers();
        });
        wrap.appendChild(chip);
      });
      const addBtn=document.createElement('div');
      addBtn.className='add-chip';
      addBtn.textContent='+ add';
      addBtn.onclick=(e)=>{e.stopPropagation();showPopover(e,topic.id,sub.id);};
      wrap.appendChild(addBtn);
      tasksTd.appendChild(wrap);
      tr.appendChild(tasksTd);
      tbody.appendChild(tr);

      if(isLast&&ti<visibleTopics.length-1){
        const sep=document.createElement('tr');
        sep.className='sep-row';
        sep.innerHTML='<td colspan="3"></td>';
        tbody.appendChild(sep);
      }
    });
  });
  renderGoalBanner();
  requestAnimationFrame(applyOverflow);
  renderMetrics();
  if(focusMode) renderFocusView();
}

function applyOverflow(){
  if(showAllTasks) return;
  const ph=phases[currentPhase];
  ph.topics.forEach(topic=>{
    topic.subjects.forEach(sub=>{
      const wrap=document.getElementById(`row-${topic.id}-${sub.id}`);
      if(!wrap) return;
      const chips=Array.from(wrap.querySelectorAll('.task-chip'));
      const addBtn=wrap.querySelector('.add-chip');
      const existing=wrap.querySelector('.overflow-badge');
      if(existing) existing.remove();
      chips.forEach(c=>c.style.display='');
      const containerW=wrap.parentElement.clientWidth-16;
      const BADGE_W=56;
      let usedW=addBtn?addBtn.offsetWidth+5:0;
      let firstHiddenIdx=-1;
      for(let i=0;i<chips.length;i++){
        const cw=chips[i].offsetWidth+5;
        if(usedW+cw+(i<chips.length-1?BADGE_W:0)>containerW){firstHiddenIdx=i;break;}
        usedW+=cw;
      }
      if(firstHiddenIdx>=0){
        const hidden=chips.length-firstHiddenIdx;
        for(let i=firstHiddenIdx;i<chips.length;i++) chips[i].style.display='none';
        const badge=document.createElement('div');
        badge.className='overflow-badge';
        badge.textContent=`+${hidden} more`;
        badge.onclick=(e)=>{e.stopPropagation();showPopover(e,topic.id,sub.id);};
        wrap.insertBefore(badge,addBtn);
      }
    });
  });
}

function showPopover(e,tid,sid){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  const sub=topic&&topic.subjects.find(x=>x.id===sid);
  if(!sub) return;
  openPopover={tid,sid};
  const pop=document.getElementById('popover');
  pop.innerHTML='';

  // Topic header
  const topicRow=document.createElement('div');
  topicRow.style.cssText='padding:4px 6px 6px;border-bottom:0.5px solid #eee;margin-bottom:2px';
  topicRow.innerHTML=`<div style="font-size:11px;color:#aaa;margin-bottom:4px">Topic</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:8px;height:8px;border-radius:50%;background:${topic.color};flex-shrink:0"></div>
      <span id="topic-name-display" style="font-size:13px;font-weight:500;flex:1">${topic.name}</span>
      <button class="act-btn" onclick="startEditTopic(${tid},${sid})">Edit</button>
      <button class="act-btn" onclick="toggleArchiveTopic(${tid})">${topic.archived?'Unarchive':'Archive'}</button>
      <button class="act-btn del" onclick="deleteTopic(${tid})">Delete</button>
    </div>`;
  pop.appendChild(topicRow);

  // Subjects section
  const subjSection=document.createElement('div');
  subjSection.style.cssText='padding:4px 6px 2px;border-bottom:0.5px solid #eee;margin-bottom:4px';
  subjSection.innerHTML=`<div style="font-size:11px;color:#aaa;margin-bottom:4px">Subjects</div>`;
  topic.subjects.forEach(s=>{
    const sRow=document.createElement('div');
    sRow.style.cssText='display:flex;align-items:center;gap:6px;padding:3px 0';
    const isActive=s.id===sid;
    const concludeBtn=s.concluded
      ?`<button class="act-btn reopen" onclick="toggleConcludeSubject(${tid},${s.id})">Reopen</button>`
      :`<button class="act-btn conclude" onclick="toggleConcludeSubject(${tid},${s.id})">Conclude</button>`;
    const nameStyle=s.concluded?'text-decoration:line-through;color:#bbb':'';
    sRow.innerHTML=`${s.concluded?'<span class="subj-check-badge"></span>':''}
      <span id="subj-name-${tid}-${s.id}" style="font-size:12px;flex:1;${nameStyle}">${s.name}</span>
      <button id="subj-edit-btn-${tid}-${s.id}" class="act-btn" onclick="startEditSubject(${tid},${s.id})">Edit</button>
      ${concludeBtn}
      <button class="act-btn del" onclick="deleteSubject(${tid},${s.id})">Del</button>`;
    subjSection.appendChild(sRow);
  });
  const addSubjRow=document.createElement('div');
  addSubjRow.style.cssText='display:flex;gap:5px;margin-top:4px';
  addSubjRow.innerHTML=`<input id="new-subj-pop" style="flex:1;font-size:12px;padding:3px 7px;border-radius:4px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a" placeholder="Add subject..." />
    <button class="act-btn" onclick="addSubject(${tid})">Add</button>`;
  subjSection.appendChild(addSubjRow);
  pop.appendChild(subjSection);

  // Tasks list
  sub.tasks.forEach(t=>{
    const row=document.createElement('div');
    row.className='popover-task';
    const pColor=t.priority==='urgent'?'#1a1a1a':t.priority==='future'?'#E8846A':t.priority==='nextphase'?'#7F77DD':'#1a1a1a';
    row.innerHTML=`<div style="width:14px;height:14px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;${t.done?'background:#1D9E75;border-color:#1D9E75':''}"></div>
      <span style="font-size:12px;flex:1;${t.done?'text-decoration:line-through;color:#999':('color:'+pColor)}">${t.text}</span>
      <span style="font-size:10px;color:${t.priority==='future'?'#E8846A':t.priority==='nextphase'?'#7F77DD':'#aaa'};flex-shrink:0">${t.priority==='urgent'?'now':t.priority==='future'?'later':t.priority==='nextphase'?'next phase':''}</span>
      <div class="popover-actions">
        <button class="act-btn" onclick="startEditTask(${tid},${sid},${t.id},this)">Edit</button>
        <button class="act-btn del" onclick="deleteTask(${tid},${sid},${t.id})">Del</button>
      </div>`;
    row.onclick=(ev)=>{if(ev.target.tagName==='BUTTON'||ev.target.tagName==='INPUT') return;toggleTask(tid,sid,t.id);showPopover(e,tid,sid);};
    row.oncontextmenu=(ev)=>{ev.preventDefault();cyclePriority(tid,sid,t.id);showPopover(e,tid,sid);};
    pop.appendChild(row);
  });

  const addRow=document.createElement('div');
  addRow.className='popover-add';
  addRow.innerHTML=`<input id="pop-inp" placeholder="New task..." /><button onclick="commitPopoverTask(${tid},${sid})">Add</button>`;
  pop.appendChild(addRow);
  pop.style.display='flex';
  document.getElementById('popover-wrap').style.display='block';
  if(e.target&&e.target!==document.body&&e.target.isConnected){
    const rect=e.target.getBoundingClientRect();
    if(rect.width>0||rect.height>0){
      pop.style.top=(rect.bottom+window.scrollY+4)+'px';
      pop.style.left=Math.min(rect.left,window.innerWidth-290)+'px';
    }
  }
  setTimeout(()=>{const i=document.getElementById('pop-inp');if(i)i.focus();},50);
}

function startEditTask(tid,sid,taskId,btn){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  const sub=topic&&topic.subjects.find(x=>x.id===sid);
  const t=sub&&sub.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const row=btn.closest('.popover-task');
  const textSpan=row.querySelector('span');
  const oldText=t.text;
  const inp=document.createElement('input');
  inp.className='inline-edit';
  inp.value=oldText;
  textSpan.replaceWith(inp);
  btn.textContent='Save';
  btn.onclick=()=>{
    const val=inp.value.trim();
    if(val){t.text=val;saveData();renderTable();}
    btn.closest('.popover-task').querySelector('.inline-edit')?.replaceWith(Object.assign(document.createElement('span'),{textContent:t.text,style:'font-size:12px;flex:1;color:#1a1a1a'}));
    showPopover({target:btn},tid,sid);
  };
  inp.onkeydown=(ev)=>{if(ev.key==='Enter') btn.click();if(ev.key==='Escape') showPopover({target:btn},tid,sid);};
  inp.focus();
}

function deleteTask(tid,sid,taskId){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  const sub=topic&&topic.subjects.find(x=>x.id===sid);
  if(!sub) return;
  sub.tasks=sub.tasks.filter(x=>x.id!==taskId);
  saveData();renderTable();
  showPopover({target:document.body},tid,sid);
}

function startEditTopic(tid,sid){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  if(!topic) return;
  const disp=document.getElementById('topic-name-display');
  if(!disp) return;
  const inp=document.createElement('input');
  inp.className='inline-edit';
  inp.value=topic.name;
  disp.replaceWith(inp);
  inp.focus();
  inp.onkeydown=(ev)=>{
    if(ev.key==='Enter'){topic.name=inp.value.trim()||topic.name;saveData();renderTable();showPopover({target:inp},tid,sid);}
    if(ev.key==='Escape') showPopover({target:inp},tid,sid);
  };
}

function deleteTopic(tid){
  if(!confirm('Delete this topic and all its tasks?')) return;
  phases[currentPhase].topics=phases[currentPhase].topics.filter(x=>x.id!==tid);
  saveData();renderTable();closePopover();
}

/** Pure — sets topic.archived=true. */
function archiveTopic(phasesData,phaseKey,topicId){
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];if(!ph) return data;
  const topic=ph.topics.find(t=>t.id===topicId);if(!topic) return data;
  topic.archived=true;
  return data;
}
window.archiveTopic=archiveTopic;

/** Pure — removes topic.archived flag. */
function unarchiveTopic(phasesData,phaseKey,topicId){
  const data=JSON.parse(JSON.stringify(phasesData));
  const ph=data[phaseKey];if(!ph) return data;
  const topic=ph.topics.find(t=>t.id===topicId);if(!topic) return data;
  delete topic.archived;
  return data;
}
window.unarchiveTopic=unarchiveTopic;

function toggleArchiveTopic(tid){
  const topic=phases[currentPhase].topics.find(t=>t.id===tid);
  if(!topic) return;
  phases=topic.archived?unarchiveTopic(phases,currentPhase,tid):archiveTopic(phases,currentPhase,tid);
  saveData();renderTable();renderColNumbers();closePopover();
}

function commitPopoverTask(tid,sid){
  const inp=document.getElementById('pop-inp');
  if(!inp||!inp.value.trim()) return;
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  const sub=topic&&topic.subjects.find(x=>x.id===sid);
  if(sub){const maxId=sub.tasks.reduce((a,t)=>Math.max(a,t.id),0);sub.tasks.push({id:maxId+1,text:inp.value.trim(),done:false});}
  saveData();
  inp.value='';
  renderTable();
  showPopover({target:document.body},tid,sid);
}

function closePopover(){
  document.getElementById('popover').style.display='none';
  document.getElementById('popover-wrap').style.display='none';
  openPopover=null;
}

function toggleTask(tid,sid,taskId){
  const t=phases[currentPhase].topics.find(x=>x.id===tid);
  const s=t&&t.subjects.find(x=>x.id===sid);
  const tk=s&&s.tasks.find(x=>x.id===taskId);
  if(tk) tk.done=!tk.done;
  saveData();
  renderTable();
}

function cyclePriority(tid,sid,taskId){
  const t=phases[currentPhase].topics.find(x=>x.id===tid);
  const s=t&&t.subjects.find(x=>x.id===sid);
  const tk=s&&s.tasks.find(x=>x.id===taskId);
  if(!tk) return;
  const order=[undefined,"urgent","future"];
  const idx=order.indexOf(tk.priority);
  tk.priority=order[(idx+1)%3];
  saveData();
  renderTable();
}

function addTopic(){
  const tInp=document.getElementById('new-topic-inp');
  const sInp=document.getElementById('new-subj-inp');
  const name=tInp.value.trim();
  if(!name) return;
  const allTopics=Object.values(phases).flatMap(p=>p.topics);
  const maxTid=allTopics.reduce((a,t)=>Math.max(a,t.id),0);
  const maxSid=allTopics.flatMap(t=>t.subjects).reduce((a,s)=>Math.max(a,s.id),0);
  const newSid=maxSid+1;
  const newTid=maxTid+1;
  const subjName=sInp.value.trim()||'General';
  phases[currentPhase].topics.push({id:newTid,name,color:COLORS[colorIdx%COLORS.length],subjects:[{id:newSid,name:subjName,goal:'',tasks:[]}]});
  colorIdx++;tInp.value='';sInp.value='';
  saveData();
  renderTable();
}

function exportNowTasks(){
  const allNow=[];
  Object.entries(phases).forEach(([phaseKey,ph])=>{
    ph.topics.forEach(topic=>{
      topic.subjects.forEach(sub=>{
        sub.tasks.filter(t=>t.priority==='urgent'&&!t.done).forEach(t=>{
          allNow.push({text:t.text,topic:topic.name,subject:sub.name,phase:ph.label});
        });
      });
    });
  });

  if(allNow.length===0){
    alert("No tasks marked as 'now' found across all phases.");
    return;
  }

  const now=new Date();
  const stamp=now.toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const due=new Date(now);
  due.setDate(due.getDate()+14);
  const dueStr=due.toISOString().slice(0,10).replace(/-/g,'');

  const CRLF='\r\n';
  let ics='BEGIN:VCALENDAR'+CRLF+'VERSION:2.0'+CRLF+'PRODID:-//OS Projects//EN'+CRLF+'CALSCALE:GREGORIAN'+CRLF;
  allNow.forEach((t,i)=>{
    const uid='osprojekt-'+stamp+'-'+i+'@osprojects';
    ics+='BEGIN:VTODO'+CRLF;
    ics+='UID:'+uid+CRLF;
    ics+='DTSTAMP:'+stamp+CRLF;
    ics+='SUMMARY:'+t.text+CRLF;
    ics+='DESCRIPTION:'+t.phase+' > '+t.topic+' > '+t.subject+CRLF;
    ics+='DUE;VALUE=DATE:'+dueStr+CRLF;
    ics+='PRIORITY:1'+CRLF;
    ics+='STATUS:NEEDS-ACTION'+CRLF;
    ics+='END:VTODO'+CRLF;
  });
  ics+='END:VCALENDAR';

  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='os-projects-now-tasks.ics';
  a.click();
  URL.revokeObjectURL(url);

  const toast=document.getElementById('export-toast');
  toast.style.opacity='1';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{toast.style.opacity='0';},2000);
}

function forceReset(){
  if(!confirm('This will reload all default topics and tasks. Continue?')) return;
  phases=resetToDefault();
  _histSetLabel('Reset data');
  saveData();   // push the reset remotely, otherwise Supabase keeps the old data
  renderTabs();
  renderTable();
}

function renderColNumbers(){
  const container=document.getElementById('col-numbers');
  if(!container) return;
  container.innerHTML='';
  const maxTasks=showAllTasks?Math.max(0,...phases[currentPhase].topics.map(t=>Math.max(0,...t.subjects.map(s=>s.tasks.filter(tk=>!tk.done).length)))):3;
  for(let i=1;i<=maxTasks;i++){
    const cell=document.createElement('div');
    const colW=window.innerWidth<=768?140:window.innerWidth<=480?120:200;
    cell.style.cssText=`width:${colW}px;flex-shrink:0;font-size:10px;color:#bbb;text-align:center;border-right:1px solid #ccc;padding:1px 0`;
    cell.textContent=i;
    container.appendChild(cell);
  }
}

let showAllTasks=false;
let showArchived=false;
let focusMode=false;
let focusPriority='urgent';
let _focusDragIdx=null;

/** Config for each focus-style category view. */
const FOCUS_VIEWS={
  urgent:{btnId:'focus-btn',off:'Focus',on:'Exit focus',empty:'No urgent tasks in this phase.'},
  nextphase:{btnId:'next-btn',off:'Next phase',on:'Exit next phase',empty:'No \u201cnext phase\u201d tasks in this phase.'},
  future:{btnId:'later-btn',off:'Later',on:'Exit later',empty:'No \u201clater\u201d tasks in this phase.'}
};

function toggleShowAll(){
  showAllTasks=!showAllTasks;
  document.getElementById('show-all-btn').textContent=showAllTasks?'Show 3 columns':'Show all tasks';
  renderTable();
  renderColNumbers();
}

function toggleShowArchived(){
  showArchived=!showArchived;
  renderTable();
  renderColNumbers();
}

function setFocusMode(priority){
  if(focusMode&&focusPriority===priority){focusMode=false;}
  else{focusMode=true;focusPriority=priority;}
  Object.keys(FOCUS_VIEWS).forEach(p=>{
    const cfg=FOCUS_VIEWS[p];
    const b=document.getElementById(cfg.btnId);
    if(!b) return;
    const active=focusMode&&focusPriority===p;
    b.textContent=active?cfg.on:cfg.off;
    b.classList.toggle('mode-active',active);
  });
  const tbl=document.querySelector('table');
  const atr=document.querySelector('.add-topic-row');
  const fv=document.getElementById('focus-view');
  if(tbl) tbl.style.display=focusMode?'none':'';
  if(atr) atr.style.display=focusMode?'none':'';
  if(fv) fv.style.display=focusMode?'flex':'none';
  if(focusMode) renderFocusView();
}

function toggleFocusMode(){setFocusMode('urgent');}
function toggleNextMode(){setFocusMode('nextphase');}
function toggleLaterMode(){setFocusMode('future');}

function setTaskPriority(tid,sid,taskId,priority){
  const topic=phases[currentPhase].topics.find(t=>t.id===tid);
  const sub=topic&&topic.subjects.find(s=>s.id===sid);
  const task=sub&&sub.tasks.find(t=>t.id===taskId);
  if(!task) return;
  task.priority=priority;
  saveData();
  renderTable();
}

function renderFocusView(){
  const container=document.getElementById('focus-view');
  if(!container||!focusMode) return;
  container.innerHTML='';
  const tasks=getFocusTasks(phases,currentPhase,focusPriority);
  if(!tasks.length){
    const empty=document.createElement('div');
    empty.style.cssText='font-size:13px;color:#aaa;padding:2rem 0;text-align:center;width:100%';
    empty.textContent=(FOCUS_VIEWS[focusPriority]||FOCUS_VIEWS.urgent).empty;
    container.appendChild(empty);
    return;
  }
  tasks.forEach((task,idx)=>{
    const item=document.createElement('div');
    item.className='focus-item focus-cat-'+focusPriority+(task.focusUrgent?' focus-item-urgent':'');

    const handle=document.createElement('span');
    handle.className='focus-drag-handle';
    handle.textContent='⠿';
    handle.title='Drag to reorder';
    item.appendChild(handle);

    const check=document.createElement('div');
    check.className='chip-check';
    check.style.flexShrink='0';
    check.onclick=()=>{toggleTask(task.topicId,task.subjectId,task.taskId);};
    item.appendChild(check);

    const content=document.createElement('div');
    content.style.cssText='flex:1;min-width:0';
    const textDiv=document.createElement('div');
    textDiv.className='focus-task-text';
    textDiv.style.cssText='font-size:13px;color:#1a1a1a;line-height:1.3;word-break:break-word';
    textDiv.textContent=task.text;
    const metaDiv=document.createElement('div');
    metaDiv.style.cssText='display:flex;align-items:center;gap:4px;margin-top:2px';
    metaDiv.innerHTML=`<div style="width:6px;height:6px;border-radius:50%;background:${task.topicColor};flex-shrink:0"></div><span style="font-size:11px;color:#aaa">${task.topicName} · ${task.subjectName}</span>`;
    content.appendChild(textDiv);
    content.appendChild(metaDiv);
    item.appendChild(content);

    const urgentBtn=document.createElement('span');
    urgentBtn.style.cssText=`font-size:11px;cursor:pointer;flex-shrink:0;padding:2px 6px;border:0.5px solid ${task.focusUrgent?'#1a1a1a':'#ddd'};border-radius:4px;white-space:nowrap;color:${task.focusUrgent?'#1a1a1a':'#bbb'};font-weight:${task.focusUrgent?'500':'400'}`;
    urgentBtn.textContent=task.focusUrgent?'urgent ×':'urgent';
    urgentBtn.title=task.focusUrgent?'Remove urgent':'Mark as urgent';
    urgentBtn.onclick=()=>{phases=toggleFocusUrgent(phases,currentPhase,task.topicId,task.subjectId,task.taskId);saveData();renderFocusView();};
    item.appendChild(urgentBtn);

    item.draggable=true;
    item.addEventListener('dragstart',e=>{
      _focusDragIdx=idx;
      e.dataTransfer.effectAllowed='move';
      item.classList.add('focus-dragging');
    });
    item.addEventListener('dragend',()=>{
      _focusDragIdx=null;
      item.classList.remove('focus-dragging');
      document.querySelectorAll('.focus-drop-before,.focus-drop-after').forEach(el=>el.classList.remove('focus-drop-before','focus-drop-after'));
    });
    item.addEventListener('dragover',e=>{
      if(_focusDragIdx===null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.focus-drop-before,.focus-drop-after').forEach(el=>el.classList.remove('focus-drop-before','focus-drop-after'));
      const rect=item.getBoundingClientRect();
      if(e.clientY<rect.top+rect.height/2) item.classList.add('focus-drop-before');
      else item.classList.add('focus-drop-after');
    });
    item.addEventListener('dragleave',e=>{
      if(!e.relatedTarget||!item.contains(e.relatedTarget)) item.classList.remove('focus-drop-before','focus-drop-after');
    });
    item.addEventListener('drop',e=>{
      e.preventDefault();
      item.classList.remove('focus-drop-before','focus-drop-after');
      if(_focusDragIdx===null||_focusDragIdx===idx) return;
      const rect=item.getBoundingClientRect();
      const after=e.clientY>=rect.top+rect.height/2;
      phases=reorderFocus(phases,currentPhase,_focusDragIdx,idx,after,focusPriority);
      saveData();
      renderFocusView();
    });

    container.appendChild(item);
  });
}

function addSubject(tid){
  const inp=document.getElementById('new-subj-pop');
  if(!inp||!inp.value.trim()) return;
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  if(!topic) return;
  const allTopics=Object.values(phases).flatMap(p=>p.topics);
  const maxSid=allTopics.flatMap(t=>t.subjects).reduce((a,s)=>Math.max(a,s.id),0);
  const newSub={id:maxSid+1,name:inp.value.trim(),goal:'',tasks:[]};
  topic.subjects.push(newSub);
  saveData();renderTable();
  showPopover({target:document.body},tid,newSub.id);
}

function startEditSubject(tid,sid){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  const sub=topic&&topic.subjects.find(x=>x.id===sid);
  if(!sub) return;
  const sp=document.getElementById(`subj-name-${tid}-${sid}`);
  const editBtn=document.getElementById(`subj-edit-btn-${tid}-${sid}`);
  if(!sp) return;
  const inp=document.createElement('input');
  inp.style.cssText='flex:1;font-size:12px;padding:2px 6px;border-radius:4px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a;min-width:0';
  inp.value=sub.name;
  sp.replaceWith(inp);
  if(editBtn){
    editBtn.textContent='Save';
    editBtn.onclick=()=>{
      sub.name=inp.value.trim()||sub.name;
      saveData();renderTable();
      showPopover({target:inp},tid,sid);
    };
  }
  inp.onkeydown=(ev)=>{if(ev.key==='Enter'&&editBtn) editBtn.click();if(ev.key==='Escape') showPopover({target:inp},tid,sid);};

function deleteSubject(tid,sid){
  const topic=phases[currentPhase].topics.find(x=>x.id===tid);
  if(!topic||topic.subjects.length<=1){alert('A topic must have at least one subject.');return;}

  topic.subjects=topic.subjects.filter(x=>x.id!==sid);
  saveData();renderTable();
  showPopover({target:document.body},tid,topic.subjects[0].id);
}

function backupData(){
  const timestamp=new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
  const payload={version:1,timestamp,phases:JSON.parse(JSON.stringify(phases))};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`os-projects-backup-${timestamp}.json`;a.click();
  URL.revokeObjectURL(url);
  const toast=document.getElementById('export-toast');
  toast.textContent='Backup saved!';toast.style.opacity='1';
  clearTimeout(toast._t);toast._t=setTimeout(()=>{toast.style.opacity='0';toast.textContent='Downloaded!';},2000);
}

function restoreData(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const payload=JSON.parse(e.target.result);
      if(!payload.phases) throw new Error('Invalid backup file');
      const hasData=Object.keys(payload.phases).some(k=>payload.phases[k]&&payload.phases[k].topics&&payload.phases[k].topics.length>0);
      if(!hasData) throw new Error('Backup appears empty');
      if(!confirm(`Restore backup from ${payload.timestamp||'unknown date'}? This will overwrite all current data.`)) return;
      phases=payload.phases;
      _histSetLabel('Restore backup');
      saveData();
      renderTabs();
      renderTable();
      renderColNumbers();
      const toast=document.getElementById('export-toast');
